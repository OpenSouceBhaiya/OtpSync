<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>OTP Sync</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #16161c;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }
  .mailsync-toast-card {
    width: 100%;
    height: 100%;
    padding: 14px 16px;
    background: rgba(22, 22, 28, 0.96);
    border: 1px solid rgba(0, 255, 163, 0.3);
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 25px rgba(0,255,163,0.08), inset 0 1px 0 rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    gap: 14px;
    box-sizing: border-box;
  }
  .mailsync-toast-icon {
    width: 40px;
    height: 40px;
    background: rgba(0,255,163,0.12);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: 1px solid rgba(0,255,163,0.2);
  }
  .mailsync-toast-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1px;
    overflow: hidden;
    min-width: 0;
  }
  .mailsync-toast-title {
    color: #00FFA3;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }
  .mailsync-toast-code {
    color: #FFFFFF;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 3px;
    white-space: nowrap;
    line-height: 1.2;
  }
  .mailsync-toast-sender {
    color: rgba(255,255,255,0.5);
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
</style>
</head>
<body>
  <div class="mailsync-toast-card" id="toast-card">
    <div class="mailsync-toast-icon">
      <img src="icon48.png" width="24" height="24" alt="Icon">
    </div>
    <div class="mailsync-toast-content">
      <div class="mailsync-toast-title" id="toast-title">✓ OTP COPIED</div>
      <div class="mailsync-toast-code" id="toast-code">------</div>
      <div class="mailsync-toast-sender" id="toast-sender">from OTP Sync</div>
    </div>
  </div>
  <script src="toast_popup.js"></script>
</body>
</html>
